<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIW Festival - Attori</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content">
        <div class="page-header">
            <h1>Tutti gli Attori</h1>
            <p class="page-subtitle">Elenco degli attori presenti nel sistema</p>
        </div>

        <div th:if="${attori.isEmpty()}" class="empty-state">
            <div class="empty-icon"></div>
            <p>Nessun attore registrato.</p>
        </div>

        <div th:unless="${attori.isEmpty()}">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cognome</th>
                        <th>Data di Nascita</th>
                        <th>Nazionalita'</th>
                        <th>Film interpretati</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${attori}">
                        <td th:text="${r.nome}">Nome</td>
                        <td th:text="${r.cognome}">Cognome</td>
                        <td th:text="${#temporals.format(r.dataNascita, 'dd/MM/yyyy')}">Data</td>
                        <td th:text="${r.nazionalita}">Nazionalita'</td>
                        <td th:text="${r.interpretazioni.size()}">0</td>
                        <td>
                            <a th:href="@{'/attore/' + ${r.id}}" class="btn-small">Vedi</a>
                            <a sec:authorize="hasRole('ADMIN')"
                               th:href="@{'/admin/attore/' + ${r.id} + '/edit'}" class="btn-small">Modifica</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div sec:authorize="hasRole('ADMIN')" class="page-actions">
            <a th:href="@{/admin/attori/new}" class="btn btn-primary">Nuovo Attore</a>
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">&larr; Dashboard</a>
        </div>
    </section>
</body>
</html>
